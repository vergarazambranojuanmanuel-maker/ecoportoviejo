<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto – EcoPortoviejo</title>
<meta name="description" content="Formulario de contacto de EcoPortoviejo para dudas y sugerencias.">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="cabecera">
  <img src="img/logo.svg" alt="" width="48" height="48">
  <p class="titulo">EcoPortoviejo</p>
  <nav aria-label="Principal">
    <ul class="menu">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="guia.html">Guía de reciclaje</a></li>
      <li><a href="contacto.html" aria-current="page">Contacto</a></li>
    </ul>
  </nav>
</header>
<main class="contenido">
  <h1>Contacto</h1>
  <p>Escríbenos tus dudas o sugerencias. Los campos marcados con * son obligatorios.</p>
  <form onsubmit="return validar()">
    <p><label for="nombre">Nombre completo *</label><br>
    <input type="text" id="nombre" name="nombre" autocomplete="name" required></p>
    <p><label for="correo">Correo electrónico *</label><br>
    <input type="email" id="correo" name="correo" autocomplete="email" required></p>
    <p><label for="mensaje">Mensaje *</label><br>
    <textarea id="mensaje" name="mensaje" rows="5" required></textarea></p>
    <button type="submit" class="enviar">Enviar mensaje</button>
    <div id="error" class="error-texto"></div>
  </form>
</main>
<footer class="pie"><p>© 2026 EcoPortoviejo. Proyecto académico.</p></footer>
<script src="js/script.js"></script>
</body>
</html>

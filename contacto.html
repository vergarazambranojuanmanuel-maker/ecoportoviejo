<!DOCTYPE html>

<body>
<header class="cabecera">
  <img src="img/logo.svg" width="48" height="48">

<main class="contenido">
  <h1>Contacto</h1>
  <p>Escríbenos tus dudas o sugerencias.</p>
  <form onsubmit="return validar()">
    Nombre: <input type="text" id="nombre"><br><br>
    Correo: <input type="text" id="correo"><br><br>
    Mensaje:<br>
    <textarea id="mensaje" rows="4" cols="40"></textarea><br><br>
    <input type="submit" value="Enviar" class="enviar">
    <div id="error" class="error-texto"></div>
  </form>
</main>
